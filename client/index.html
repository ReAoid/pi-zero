<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pi-zero · 墨</title>
  <!-- 分层主题系统：base.css = 组件结构，theme-*.css = 主题令牌 -->
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/theme-ink-wash.css" id="theme-stylesheet-ink-wash" />
  <link rel="stylesheet" href="styles/theme-scandinavian.css" id="theme-stylesheet-scandinavian" disabled />
</head>
<body>
  <!-- ════════════════════════════════════════════
       圣杯布局容器 (Holy Grail Layout)
       ════════════════════════════════════════════ -->
  <div class="holy-grail">

    <!-- ── 固定页头 ── -->
    <header class="holy-grail-header">
      <div id="status-dot"></div>
      <h1 class="theme-gradient-text">pi-zero</h1>
      <span class="badge">alpha</span>
      <button class="nav-toggle-btn" id="nav-toggle" title="切换左侧导航">
        <span id="nav-icon">◀</span>
      </button>
      <span id="model-name"></span>
      <button class="aside-toggle-btn" id="aside-toggle" title="切换右侧边栏">
        <span id="aside-icon">▶</span>
      </button>
      <button class="setting-btn" id="setting-toggle" title="设置">
        <span id="setting-icon">⚙</span>
      </button>
    </header>

    <!-- ── 三列主体 ── -->
    <div class="holy-grail-body">

      <!-- 左侧导航栏（暂空） -->
      <nav class="holy-grail-nav" id="left-nav">
        <!-- 预留左侧导航 -->
      </nav>

      <!-- 主内容区：聊天界面 -->
      <main class="holy-grail-main">
        <div id="messages"></div>
        <div id="input-area">
          <textarea id="input" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" autofocus></textarea>
          <button id="send-btn">发送</button>
        </div>
      </main>

      <!-- 右侧边栏（暂空） -->
      <aside class="holy-grail-aside" id="right-aside">
        <!-- 预留右侧边栏 -->
      </aside>

    </div>

    <!-- ── 固定页脚 ── -->
    <!-- ── 设置弹框 ── -->
    <div class="modal-overlay" id="settings-modal">
      <div class="modal-dialog modal-dialog--wide">
        <div class="modal-header">
          <h2>设置</h2>
          <button class="modal-close-btn" id="modal-close" title="关闭">&times;</button>
        </div>
        <div class="modal-body modal-body--split">
          <!-- 左侧分类导航 -->
          <nav class="settings-nav">
            <button class="settings-nav__item active" data-tab="interface">
              <span class="settings-nav__icon">🖥</span>
              <span>界面</span>
            </button>
            <button class="settings-nav__item" data-tab="provider">
              <span class="settings-nav__icon">🔌</span>
              <span>供应商</span>
            </button>
            <button class="settings-nav__item" data-tab="storage">
              <span class="settings-nav__icon">💾</span>
              <span>存储</span>
            </button>
          </nav>
          <!-- 右侧内容面板 -->
          <div class="settings-content">
            <!-- 界面 -->
            <div class="settings-pane active" id="pane-interface">
              <h3 class="settings-pane__title">界面设置</h3>
              <div class="settings-field">
                <label class="settings-label">主题风格</label>
                <select class="settings-select" id="settings-pack-select">
                  <option value="ink-wash">水墨 · Ink Wash</option>
                  <option value="scandinavian">北欧 · Scandinavian</option>
                </select>
                <p class="settings-hint">切换整体视觉主题包</p>
              </div>
              <div class="settings-field">
                <label class="settings-label">亮暗模式</label>
                <button class="settings-btn" id="settings-theme-toggle">
                  <span id="settings-theme-icon">☀</span>
                  <span id="settings-theme-label">昼</span>
                </button>
                <p class="settings-hint">切换明亮 / 暗色显示</p>
              </div>
            </div>
            <!-- 供应商 -->
            <div class="settings-pane" id="pane-provider">
              <h3 class="settings-pane__title">供应商配置</h3>
              <div class="settings-field">
                <label class="settings-label">LLM 供应商</label>
                <select class="settings-select" id="settings-provider">
                  <option value="openai">OpenAI</option>
                  <option value="anthropic">Anthropic</option>
                  <option value="azure">Azure OpenAI</option>
                  <option value="openrouter">OpenRouter</option>
                  <option value="local">本地 (Ollama / llama.cpp)</option>
                </select>
                <p class="settings-hint">选择 AI 模型供应商</p>
              </div>
              <div class="settings-field">
                <label class="settings-label">API Key</label>
                <div class="settings-input-group">
                  <input class="settings-input" type="password" id="settings-api-key" placeholder="sk-..." />
                  <button class="settings-btn settings-btn--sm" id="settings-key-toggle" title="显示/隐藏">👁</button>
                </div>
                <p class="settings-hint">输入您的 API 密钥，本地存储</p>
              </div>
              <div class="settings-field">
                <label class="settings-label">API 端点（可选）</label>
                <input class="settings-input" type="url" id="settings-api-endpoint" placeholder="https://api.openai.com/v1" />
                <p class="settings-hint">自定义 API 地址，留空使用默认</p>
              </div>
              <div class="settings-field">
                <label class="settings-label">模型名称</label>
                <input class="settings-input" type="text" id="settings-model" placeholder="gpt-4o" />
                <p class="settings-hint">指定使用的模型名称</p>
              </div>
              <button class="settings-btn settings-btn--primary" id="settings-provider-save">保存供应商配置</button>
            </div>
            <!-- 存储 -->
            <div class="settings-pane" id="pane-storage">
              <h3 class="settings-pane__title">存储设置</h3>
              <div class="settings-field">
                <label class="settings-label">会话记录</label>
                <input class="settings-input" type="text" id="settings-session-path" placeholder="./data/sessions" />
                <p class="settings-hint">聊天会话历史存储路径</p>
              </div>
              <div class="settings-field">
                <label class="settings-label">知识库</label>
                <input class="settings-input" type="text" id="settings-knowledge-path" placeholder="./data/knowledge" />
                <p class="settings-hint">知识库文件存储路径</p>
              </div>
              <div class="settings-field">
                <label class="settings-label">日志</label>
                <input class="settings-input" type="text" id="settings-log-path" placeholder="./data/logs" />
                <p class="settings-hint">运行日志存储路径</p>
              </div>
              <button class="settings-btn settings-btn--primary" id="settings-storage-save">保存存储配置</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="holy-grail-footer">
      <span>pi-zero · powered by pi-coding-agent</span>
    </footer>

  </div>

  <script>
    // ═══════════════════════════════════════════════════
    //  主题系统初始化
    // ═══════════════════════════════════════════════════
    (function initTheme() {
      const html = document.documentElement;

      // ── 主题包（pack）加载 ──
      window.__loadPack = function(slug) {
        document.querySelectorAll('link[id^="theme-stylesheet-"]').forEach(link => {
          link.disabled = true;
        });
        const target = document.getElementById("theme-stylesheet-" + slug);
        if (target) target.disabled = false;
        localStorage.setItem("pi-zero-pack", slug);
      };

      const savedPack = localStorage.getItem("pi-zero-pack") || "ink-wash";
      window.__loadPack(savedPack);

      // ── 亮暗模式初始化 ──
      const saved = localStorage.getItem("pi-zero-theme") || "dark";
      html.setAttribute("data-theme", saved);
    })();

    // 全局亮暗切换函数（供设置面板调用）
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute("data-theme");
      const next    = current === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("pi-zero-theme", next);
    }

    // ── 设置弹框 ──
    const settingToggle = document.getElementById("setting-toggle");
    const settingsModal = document.getElementById("settings-modal");
    const modalClose    = document.getElementById("modal-close");

    function openSettings() {
      settingsModal.classList.add("open");
    }

    function closeSettings() {
      settingsModal.classList.remove("open");
    }

    settingToggle.addEventListener("click", openSettings);
    modalClose.addEventListener("click", closeSettings);

    // 点击遮罩关闭弹框
    settingsModal.addEventListener("click", (e) => {
      if (e.target === settingsModal) closeSettings();
    });

    // ESC 键关闭弹框
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && settingsModal.classList.contains("open")) {
        closeSettings();
      }
    });

    // ── 设置面板 Tab 切换 ──
    const navItems = document.querySelectorAll(".settings-nav__item");
    const panes   = document.querySelectorAll(".settings-pane");

    navItems.forEach(item => {
      item.addEventListener("click", () => {
        // 切换导航高亮
        navItems.forEach(n => n.classList.remove("active"));
        item.classList.add("active");
        // 切换内容面板
        const tab = item.dataset.tab;
        panes.forEach(p => p.classList.remove("active"));
        document.getElementById("pane-" + tab).classList.add("active");
      });
    });

    // ── 界面标签：主题包 & 亮暗切换 ──
    const settingsPackSelect = document.getElementById("settings-pack-select");
    const settingsThemeBtn   = document.getElementById("settings-theme-toggle");
    const settingsThemeIcon  = document.getElementById("settings-theme-icon");
    const settingsThemeLabel = document.getElementById("settings-theme-label");

    // 同步设置面板 UI 与当前主题状态
    function syncSettingsThemeUI() {
      const html = document.documentElement;
      const isDark = html.getAttribute("data-theme") === "dark";
      settingsThemeIcon.textContent  = isDark ? "☀" : "○";
      settingsThemeLabel.textContent = isDark ? "昼" : "墨";
    }

    // 初始化
    const savedPack = localStorage.getItem("pi-zero-pack") || "ink-wash";
    settingsPackSelect.value = savedPack;
    syncSettingsThemeUI();

    settingsPackSelect.addEventListener("change", () => {
      window.__loadPack(settingsPackSelect.value);
    });

    settingsThemeBtn.addEventListener("click", () => {
      toggleTheme();
      syncSettingsThemeUI();
    });

    // ── 供应商标签：本地存储 ──
    const providerSelect = document.getElementById("settings-provider");
    const apiKeyInput    = document.getElementById("settings-api-key");
    const apiEndpointInput = document.getElementById("settings-api-endpoint");
    const modelInput     = document.getElementById("settings-model");
    const providerSaveBtn = document.getElementById("settings-provider-save");
    const keyToggleBtn   = document.getElementById("settings-key-toggle");

    // 加载已保存的供应商配置
    function loadProviderConfig() {
      const saved = localStorage.getItem("pi-zero-provider");
      if (saved) {
        try {
          const cfg = JSON.parse(saved);
          providerSelect.value = cfg.provider || "openai";
          apiKeyInput.value    = cfg.apiKey || "";
          apiEndpointInput.value = cfg.endpoint || "";
          modelInput.value     = cfg.model || "";
        } catch (e) {}
      }
    }
    loadProviderConfig();

    providerSaveBtn.addEventListener("click", () => {
      const config = {
        provider: providerSelect.value,
        apiKey:   apiKeyInput.value,
        endpoint: apiEndpointInput.value,
        model:    modelInput.value
      };
      localStorage.setItem("pi-zero-provider", JSON.stringify(config));
      alert("供应商配置已保存");
    });

    // API Key 显示/隐藏
    keyToggleBtn.addEventListener("click", () => {
      const t = apiKeyInput.type;
      apiKeyInput.type = t === "password" ? "text" : "password";
      keyToggleBtn.textContent = t === "password" ? "🙈" : "👁";
    });

    // ── 存储标签：本地存储 ──
    const sessionPathInput   = document.getElementById("settings-session-path");
    const knowledgePathInput = document.getElementById("settings-knowledge-path");
    const logPathInput       = document.getElementById("settings-log-path");
    const storageSaveBtn     = document.getElementById("settings-storage-save");

    function loadStorageConfig() {
      const saved = localStorage.getItem("pi-zero-storage");
      if (saved) {
        try {
          const cfg = JSON.parse(saved);
          sessionPathInput.value   = cfg.sessions || "";
          knowledgePathInput.value = cfg.knowledge || "";
          logPathInput.value       = cfg.logs || "";
        } catch (e) {}
      }
    }
    loadStorageConfig();

    storageSaveBtn.addEventListener("click", () => {
      const config = {
        sessions:  sessionPathInput.value,
        knowledge: knowledgePathInput.value,
        logs:      logPathInput.value
      };
      localStorage.setItem("pi-zero-storage", JSON.stringify(config));
      alert("存储配置已保存");
    });

    // ── 侧栏折叠/展开 ──
    const navToggle  = document.getElementById("nav-toggle");
    const asideToggle = document.getElementById("aside-toggle");
    const leftNav    = document.getElementById("left-nav");
    const rightAside = document.getElementById("right-aside");
    const navIcon    = document.getElementById("nav-icon");
    const asideIcon  = document.getElementById("aside-icon");

    navToggle.addEventListener("click", () => {
      const collapsed = leftNav.classList.toggle("collapsed");
      navIcon.textContent = collapsed ? "▶" : "◀";
      navToggle.title = collapsed ? "展开左侧导航" : "收起左侧导航";
    });

    asideToggle.addEventListener("click", () => {
      const collapsed = rightAside.classList.toggle("collapsed");
      asideIcon.textContent = collapsed ? "◀" : "▶";
      asideToggle.title = collapsed ? "展开右侧边栏" : "收起右侧边栏";
    });

    // ═══════════════════════════════════════════════════
    //  DOM refs
    // ═══════════════════════════════════════════════════
    const $ = (s) => document.querySelector(s);
    const statusDot  = $("#status-dot");
    const modelName  = $("#model-name");
    const messages   = $("#messages");
    const input      = $("#input");
    const sendBtn    = $("#send-btn");

    let currentAssistantMsg = null; // 当前正在接收的 AI 消息元素
    let busy = false;

    // ═══════════════════════════════════════════════════
    //  WebSocket
    // ═══════════════════════════════════════════════════
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocol}//${location.host}`);

    ws.onopen = () => {
      statusDot.className = "connected";
      console.log("[WS] 已连接");
    };

    ws.onclose = () => {
      statusDot.className = "";
      busy = false;
      sendBtn.disabled = false;
    };

    ws.onmessage = (e) => {
      try {
        const event = JSON.parse(e.data);
        handleEvent(event);
      } catch (err) {
        console.error("解析事件失败:", err);
      }
    };

    // ═══════════════════════════════════════════════════
    //  事件处理
    // ═══════════════════════════════════════════════════
    function handleEvent(event) {
      switch (event.type) {

        // ── 流式文本 ──
        case "message_update": {
          const ev = event.assistantMessageEvent;
          if (!ev) break;

          if (ev.type === "text_delta") {
            if (!currentAssistantMsg) {
              currentAssistantMsg = addMessage("assistant");
            }
            currentAssistantMsg.querySelector(".text").textContent += ev.delta;
            scrollToBottom();
          }

          if (ev.type === "thinking_delta") {
            // 可选择显示思考过程
          }
          break;
        }

        // ── Tool 执行 ──
        case "tool_execution_start": {
          const el = document.createElement("div");
          el.className = "tool-call";
          el.dataset.toolCallId = event.toolCallId;
          el.innerHTML = `<span class="spinner"></span> 正在执行: ${event.toolName}`;
          messages.appendChild(el);
          scrollToBottom();
          break;
        }

        case "tool_execution_end": {
          const el = messages.querySelector(`[data-tool-call-id="${event.toolCallId}"]`);
          if (el) {
            el.innerHTML = `✅ 执行完成: ${event.toolName}`;
            if (event.isError) {
              el.innerHTML = `❌ 执行出错: ${event.toolName}`;
            }
          }
          break;
        }

        // ── Agent 生命周期 ──
        case "agent_start": {
          statusDot.className = "thinking";
          busy = true;
          sendBtn.disabled = true;
          break;
        }

        case "agent_end": {
          statusDot.className = "connected";
          currentAssistantMsg = null;
          busy = false;
          sendBtn.disabled = false;
          input.focus();
          break;
        }

        // ── 热更新：前端文件变更时自动刷新 ──
        case "hot_reload": {
          console.log("♻️  检测到前端文件变更，刷新页面...");
          location.reload();
          break;
        }

        // ── 会话信息 ──
        case "session_info": {
          if (event.model) {
            modelName.textContent = `${event.model.provider}/${event.model.id}`;
          }
          break;
        }

        default:
          break;
      }
    }

    // ═══════════════════════════════════════════════════
    //  UI 操作
    // ═══════════════════════════════════════════════════
    function addMessage(role) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = role === "user" ? "你" : "AI";

      const text = document.createElement("div");
      text.className = "text";

      div.appendChild(sender);
      div.appendChild(text);

      if (role === "assistant") {
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        text.appendChild(cursor);
      }

      messages.appendChild(div);
      scrollToBottom();
      return div;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messages.scrollTop = messages.scrollHeight;
      });
    }

    // ═══════════════════════════════════════════════════
    //  发送消息
    // ═══════════════════════════════════════════════════
    function send() {
      const text = input.value.trim();
      if (!text || busy) return;

      // 显示用户消息
      addMessage("user").querySelector(".text").textContent = text;
      input.value = "";
      input.style.height = "auto";

      // 清空当前 AI 消息（重新开始）
      currentAssistantMsg = null;

      // 发送给后端
      ws.send(JSON.stringify({ type: "prompt", text }));
    }

    // ── 输入框事件 ──
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    sendBtn.addEventListener("click", send);

    // ── 启动后聚焦 ──
    setTimeout(() => input.focus(), 300);
  </script>
</body>
</html>
